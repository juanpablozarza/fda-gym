name: LiteLLM supply-chain guard

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_litellm_security.py"
      - ".github/workflows/litellm-supply-chain.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/check_litellm_security.py"
      - ".github/workflows/litellm-supply-chain.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-approved-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify LiteLLM pin, lock hashes, and container tags
        run: python3 scripts/check_litellm_security.py
