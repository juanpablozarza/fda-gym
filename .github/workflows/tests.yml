name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --frozen --group dev
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Test
        run: uv run pytest -q
      - name: Wheel smoke
        env:
          FDAGYM_SNAPSHOT_DIR: ${{ github.workspace }}/data/snapshots
          FDAGYM_PUBLIC_JSONL: ${{ github.workspace }}/data/tasks/public.jsonl
        run: |
          uv build --wheel
          WHEEL=$(ls dist/*.whl)
          python3 -c "import sys, zipfile; names = zipfile.ZipFile(sys.argv[1]).namelist(); assert not any('snapshots' in name for name in names), names" "$WHEEL"
          TMP=$(mktemp -d /tmp/fdagym-wheel-XXXX)
          uv venv "$TMP/venv"
          uv pip install --python "$TMP/venv/bin/python" "$WHEEL"
          export FDAGYM_WHEEL="$(pwd)/$WHEEL"
          cd "$TMP"
          "$TMP/venv/bin/python" <<'PY'
          import os
          import zipfile
          from pathlib import Path

          import fdagym
          from fdagym.demo import play_public_task
          from fdagym.rewards import score
          from fdagym.rewards.version import GRADER_VERSION

          pkg = Path(fdagym.__file__).resolve()
          assert "fdagym-wheel-" in str(pkg), pkg
          assert GRADER_VERSION == "5", GRADER_VERSION
          names = zipfile.ZipFile(os.environ["FDAGYM_WHEEL"]).namelist()
          assert not any("snapshots" in name for name in names), names

          public = Path(os.environ["FDAGYM_PUBLIC_JSONL"])
          snap = Path(os.environ["FDAGYM_SNAPSHOT_DIR"])
          lines: list[str] = []
          reward = play_public_task(
              "FG-9101",
              public_path=public,
              snapshot_root=snap,
              write=lines.append,
          )
          text = "\n".join(lines)
          assert "query_adverse_events" in text
          assert reward["grader_version"] == "5"
          assert float(reward["total"]) >= 0.99
          # score() is the same grader the demo prints after every hop.
          assert score.__module__ == "fdagym.rewards.combine"
          print("wheel smoke ok", {k: reward[k] for k in ("total", "grader_version")})
          PY

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
