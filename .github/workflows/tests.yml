name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --frozen --group dev
      - name: Test
        run: uv run pytest -q
      - name: Wheel smoke
        run: |
          uv build --wheel
          WHEEL=$(ls dist/*.whl)
          TMP=$(mktemp -d /tmp/fdagym-wheel-XXXX)
          uv venv "$TMP/venv"
          uv pip install --python "$TMP/venv/bin/python" "$WHEEL"
          cd "$TMP"
          "$TMP/venv/bin/python" -c "import fdagym, fdagym.env, fdagym.rewards"
