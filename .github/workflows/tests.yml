name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e586c53184b0ec095fdf35d8c6c1c5eec8e6a8ea # v6.7.5
        with:
          python-version: "3.11"
      - name: Install
        run: uv sync --frozen --group dev
      - name: Test
        run: uv run pytest -q
