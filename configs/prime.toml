# Local verifiers v1 eval of public FDA-Gym (FG-9101–FG-9193).
# Install: uv sync --extra prime
# Dry-run (no model): uv run vf-eval @ configs/prime.toml --dry-run --no-push
# One published row:  uv run vf-eval @ configs/prime.toml --no-push
# Hub package: environments/fda-gym/. CI keeps this file at --dry-run --no-push.
# A public Hub listing is `prime env push` from that directory after merge; this config does not push.

push = false

[env.taskset]
id = "fdagym"

[select.include]
ids = ["FG-9101"]
